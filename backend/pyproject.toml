[project]
name = "one-bad-tuesday-api"
version = "0.1.0"
description = "FastAPI backend for One Bad Tuesday"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120,<1.0",
    "google-genai>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
